version: '3.8'

services:
  signaling-server:
    build: .
    container_name: vaultpeer-signaling
    restart: unless-stopped
    ports:
      - "9000:8080"
    environment:
      - PORT=8080
    # Optional: Rotate logs to prevent filling up disk space
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
